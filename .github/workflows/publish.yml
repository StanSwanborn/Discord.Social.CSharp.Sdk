name: Publish to NuGet

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build, pack & publish
    runs-on: ubuntu-latest

    # Required for GitHub OIDC / NuGet Trusted Publishing
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack Discord.Social.CSharp.csproj \
          --configuration Release \
          --output ./nupkg

      # Exchange GitHub OIDC token for a temporary NuGet API key
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: StanSwanborn

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkg/*.nupkg" \
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
          --source "https://api.nuget.org/v3/index.json" \
          --skip-duplicate
